#spring:
#  application:
#    name: order-service

  config:
    import: "configserver:"      # Config Server에서 설정 가져옴
  cloud:
    config:
      uri: http://config-server:8888
      fail-fast: false
      retry:
        max-attempts: 3
        initial-interval: 1000


spring:
  application:
    name: order-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/order_db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_batch_fetch_size: 100
    open-in-view: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# 타 MSA 서비스 URL (Eureka 사용 시 서비스명으로 대체 가능)
services:
  company:
    url: ${STORE_SERVICE_URL:http://company-service}
  product:
    url: ${PRODUCT_SERVICE_URL:http://product-service}

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
